services:
  iconform-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: iconform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iconform_dev}
      POSTGRES_DB: iconform
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iconform -d iconform"]
      interval: 5s
      timeout: 5s
      retries: 10
    # ponytail: never publish Postgres port
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  iconform-app:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://iconform:${POSTGRES_PASSWORD:-iconform_dev}@iconform-db:5432/iconform
    volumes:
      - docdata:/app/data
    depends_on:
      iconform-db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddydata:/data
    depends_on: [iconform-app]

volumes:
  pgdata:
  docdata:
  caddydata:
